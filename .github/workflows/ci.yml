# 最小 CI：只跑 etf/v1 的 pytest 基线。
# 测试本身不联网（合成数据 + 关闭因子库 git 自动提交），故无需真实行情源。
name: CI

on:
  push:
    paths:
      - "etf/v1/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "etf/v1/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: etf/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: etf/v1/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: 运行测试
        env:
          # 兜底：确保任何 LLM 调用在 CI 中快速失败而非挂起等待网络
          OPENAI_API_KEY: ""
        run: python -m pytest tests -q -ra
