# 本地 LLM 适配用提示词覆盖（不修改 site-packages）
#
# 生效原理：rdagent/utils/agent/tpl.py 的 load_content 按「进程 CWD 相对路径 →
# RD-Agent 包内默认」的顺序取模板，且文件缺失键（KeyError）会继续回落到包内，
# 所以本文件只需放要改的那几个键，其余仍用官方原文。
# factor 循环子进程的 CWD 就是本目录 rdagent_output/，故 scenarios/qlib/prompts.yaml
# 恰好覆盖 rdagent/scenarios/qlib/prompts.yaml。
# 键名与使用处：factor_proposal.py:44 用 factor_hypothesis_specification，
# factor_proposal.py:68 用 factor_experiment_output_format。
#
# 治的病：09-22 那轮 coder:7b 提出的唯一因子是 MA_5 = Σ F_{t-i}/5，把「因子值」
# 当成输入序列做滑窗。本数据集只有 OHLCV，没有「因子值」这一列，于是实现 10/10
# 失败、回收的 LaTeX 也翻不出管线 DSL（expr 为空）→ 对主线净贡献 0。

factor_hypothesis_specification: |-
  1. **Available raw data is OHLCV ONLY:**
    - The only input series you may use are the raw price/volume fields of each instrument: $open, $high, $low, $close (a.k.a. Price) and $volume.
    - You MUST NOT treat an already-computed factor, a model prediction, or any "factor value" series as an input. There is no such column in the dataset; a hypothesis built on it can never be implemented. In particular, expressions like F_{t-i} or "moving average of the factor" are forbidden — the input of every factor must be one of the five raw fields above.
    - Do not propose machine-learning, multi-dimensional or data-source factors (no alternative data, no model outputs are available here).
  2. **Simple and effective factors first:**
    - Prefer one-window transforms of a single raw field: rolling mean / std / max / min / volume-weighted average / simple day-over-day ratio of Price or Volume.
    - Concisely explain why these factors are expected to work.
    - Avoid complex or combined factors initially.
  3. **EXACTLY 2 factors per generation (hard cap):**
    - Output precisely 2 factor keys in the JSON object. Not 1, not 3, never 12.
      This machine is compute-limited: a factor experiment only reaches backtest
      ("running") after EVERY factor in it has been implemented, so the number of
      factors per generation multiplies the whole wall time.
    - Pick 2 names verbatim from the CANDIDATE LIST below (they were drafted by a
      previous generation and never backtested), so the pipeline can consume them
      immediately; only invent a new name if none fits, and stay inside the naming
      rule and off the ALREADY TESTED list.
    - All must be computable from the raw fields above. The two names must differ
      in raw field or in family (level / volatility / momentum / ratio), not just
      in window length.
  ALREADY TESTED — never propose these again (they are in the factor library):
    - 5/10/20-day SMA of Price, 5/10/20-day STD of Price
    - 5/10/20-day SMA of Volume, 5/10/20-day STD of Volume
    - 5-day MOM of Price, 20-day MOM of Volume（09-23 已回收定义，尚无 IC）
    - 5-day MOM of Volume, 20-day MIN of Price（09-23 stkwide2 轮已回收，实验级 IC 0.028656）
    - 20-day MOM of Price, 5-day SMA of Volume over 20-day SMA of Volume（09-23 stkvec 轮已回收，实验级 IC 0.032376）
    - 5-day VWAP of Price, 5/20-day MAX of Price（09-23 stkprod 轮已回收并全市场评估：
      RankIC -0.0146~-0.0159，与 5/10/20-day SMA of Price 的 -0.0126~-0.0153 是同一个量）
    THE WHOLE PRICE-LEVEL FAMILY IS ONE FACTOR, at any window and with any of SMA / VWAP / MAX /
    MIN: on the full A-share panel they all sit at RankIC -0.013~-0.016 and their tradable long
    legs are indistinguishable to the second decimal (same turnover, same excess). Proposing a
    new window or a new way of averaging the price adds no information — pick a different raw
    field or a different family instead.
    A spelled-out operator is THE SAME factor as its abbreviated token and is equally tested:
    "Momentum" = MOM, "Simple Moving Average" = SMA, "Standard Deviation" = STD, "Maximum"/"Minimum"
    = MAX/MIN. Renaming a tested factor by writing its operator in words does not make it new.
  CANDIDATE LIST (already drafted, never backtested yet — pick 2, listed most
  informative first; every remaining item is a de-leveled construction, i.e. it divides
  out the price or volume level, which is the only direction left that is not yet measured):
    - 5-day STD of Volume over 20-day STD of Volume
    - 5-day SMA of Price over 20-day SMA of Price
    - 20-day STD of Price over 20-day SMA of Price
  At most ONE of the two may be a ratio name (the "... over ..." pattern): a ratio
  needs two windows plus a division and fails implementation more often, which would
  lose the whole experiment's backtest.
  4. **Gradual complexity:**
    - Combined factors are now unlocked (all single-field level/volatility factors
      above have been backtested), but only in the exact ratio form allowed by the
      naming rule — never by feeding one computed factor into another.
  5. **New directions and optimizations:**
    - If multiple consecutive iterations fail to produce factors surpassing SOTA, switch direction and start again from simple factors of a different raw field.
  6. Note
    - Highlight that factors surpassing SOTA are included in the library to avoid re-implementation.
    - No matter how many factors you plan to generate, only reply with one set of hypothesis and reason. The hypothesis can include the proposal of multiple factors at the same time.

factor_experiment_output_format: |-
  The output should follow JSON format. The schema is as follows:
  {
      "factor name 1": {
          "description": "description of factor 1, start with its type, e.g. [Momentum Factor]",
          "formulation": "latex formulation of factor 1",
          "variables": {
              "variable or function name 1": "description of variable or function 1",
              "variable or function name 2": "description of variable or function 2"
          }
      },
      "factor name 2": {
          "description": "description of factor 2, start with its type, e.g. [Machine Learning based Factor]",
          "formulation": "latex formulation of factor 2",
          "variables": {
              "variable or function name 1": "description of variable or function 1",
              "variable or function name 2": "description of variable or function 2"
          }
      }
      # Don't add ellipsis (...) or any filler text that might cause JSON parsing errors here!
  }

  HARD NAMING RULE for every factor key ("factor name N") — it MUST be exactly ONE of:
      <N>-day <OP> of <Column>
      <M>-day <OP> of <Column> over <N>-day <OP> of <Column>      (a ratio of two such factors)
  where <N>,<M> are positive integer windows and <OP> and <Column> come from these closed lists only:
      <OP>     ∈ SMA | STD | MAX | MIN | VWAP | MOM
      <Column> ∈ Price | Volume
  MOM means simple N-day momentum (day-over-N change, not a moving average):
      price MOM:  P_t / P_{t-N} - 1        volume MOM:  V_t / V_{t-N} - 1
  Examples of valid names: "5-day SMA of Price", "20-day STD of Volume", "10-day VWAP of Price",
  "5-day MOM of Price", "5-day SMA of Volume over 20-day SMA of Volume".
  In the ratio form both halves must themselves be valid single factors above, the divisor must not
  be a constant, and the name must keep the word "over" verbatim (downstream translates the name).
  Invalid and therefore forbidden: "EMA"/"exponentially weighted" (no such operator downstream),
  "Momentum"/"Ratio"/"Factor of Factor"/any name without an explicit day window and an explicit
  Price-or-Volume column, and any formulation whose input is a computed factor instead of a raw field.
  Write the operator ONLY as one of the six uppercase tokens above. Spelling it out — "20-day
  Momentum of Price", "5-day Simple Moving Average of Volume over ..." — breaks the pipeline: the
  name you output becomes the result column name and is matched verbatim downstream, so a
  synonymous-but-different string is a duplicate factor that the library cannot recognise.
  In "formulation", write the input as the raw field itself (e.g. P_{t-i} for Price, V_{t-i} for
  Volume) and declare in "variables" that P = $close / Price and V = $volume.

# 同一类官方示例缺陷：schema 示例最后一项带尾逗号。这一键被
# scenarios/qlib/proposal/factor_proposal.py:43 用于生成因子假设，正是产因子的
# 那一环，模型照抄格式就会让 JSONParser 四策略全灭（本轮侥幸解析成功，属概率性）。
# 与包内原文逐字一致，仅删除示例里的尾逗号。
factor_hypothesis_output_format: |-
  The output should follow JSON format. The schema is as follows:
  {
  "hypothesis": "The new hypothesis generated based on the information provided. Limit in two or three sentences.",
  "reason": "The reason why you generate this hypothesis. It should be comprehensive and logical. It should cover the other keys below and extend them. Limit in two or three sentences."
  }
