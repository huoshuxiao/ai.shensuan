# CWD 层提示词覆盖：只覆盖 qlib_factor_interface 一键，其余键回落包内原文
# （生效原理与键名说明见 ../prompts.yaml 顶部注释；本文件对应
#  rdagent/scenarios/qlib/experiment/prompts.yaml）。
#
# 治的病（09-22 11:11 轮，第一次跑到 running 却没出 IC）：
# 官方原文只说「result 的 index 是 datetime+instrument、单列名是因子名」，
# 不给写法。7B 于是写出了
#     pd.DataFrame(series, columns=['10-day SMA of Volume'])
# 这在 pandas 2.x 里是**按列名做选择**：Series 名叫 volume，选不中就给回一个
# 0 行的表，随后 result_df.index = df.index 抛
#     ValueError: Length mismatch: Expected axis has 0 elements, new values have 15148258
# 一个因子炸，整个实验包的 running 就全部作废（process_factor_data 找不到可合并的
# 因子数据），于是又拿不到 IC。已在真数据上复现并验证下面的写法可用。
# 另一个不报错但语义错误、模型同样常犯的坑：直接在 (datetime, instrument) 上
# rolling，窗口会跨股票混算 —— 代码能跑通、因子值却是错的，主线拿到的 IC 无意义。
#
# 09-23 两处补（recipe 现在是完整文件形态，带 import / def / 主入口；第一句里官方
#    写错的无引号 `if __name__ == __main__` 也一并改对了 —— 模型照着错例写就会写坏）：
# 1) 补主入口两行。旧 recipe 只给读盘到 to_hdf 五行、没有主入口，7B 只能自己补一句
#    —— ETF 轮 etffix_0923 就补成 `if __name__ == '__main__:`（少一个引号），
#    SyntaxError 让 result.h5 没产出，running 末了 process_factor_data 报
#    「Factor data from None is not generated」，整轮又被 Skip loop 0
#    （那轮基准/持仓指标已拿到，就差这一口）。
# 2) 补 to_frame 只属于 Series 的告警。股票轮 stkfix_0923 演化期 3 处 Traceback
#    全是 `AttributeError: 'DataFrame' object has no attribute 'to_frame'`，
#    即 values 已是 DataFrame 还照着 recipe 调 to_frame；那轮靠 CoSTEER 重试救回，
#    但白烧了循环次数（CoSTEER_MAX_LOOP=4）。改完两线 recipe 见下（ETF 那份是
#    cp 过来的同内容副本，两线必须一起改，否则换线又重踩一次）。
#
# 09-23 晚第 3 处补（stkwide2_0923 轮实测）：Hard rules 里新增「禁止 rolling().apply(lambda)」
#    并给出动量/比值的向量化写法。该轮 7B 用
#    `groupby(level='instrument').rolling(w).apply(lambda x: x[-1]/x[0]-1)` 算 5-day MOM of
#    Volume，在 12.15M 行全市场面板上单核磨了 15+ 分钟（宿主 factor.py 进程，非容器），
#    running 步因此 29 分钟；日志字节长期不动容易被误判成卡死。
#
# 09-23 晚第 4 处补（stkprod_0923 轮实测）：原来那句「列名不等就是 format failure，
#    format checker 会拿去比对」是**假的** —— 包内根本没有列名校验（全库搜不到那句
#    "column named" 措辞，它只是裁判模型的自述）。该轮 `20-day MAX of Price` 的 factor.py
#    被裁判改成 to_frame('20-day MAX of price ')（小写 p + 尾随空格），coder 照改了，
#    回测与回收都没受影响（result.h5 按位置读，factors.json 的名字取任务侧 factor_name），
#    所以真正的风险不是管线断裂，而是「裁判自己抄错名字」。下面据此把规则改成：
#    列名要逐字等于**任务里给的**因子名；评审若要求改名，不得从评审文本里抄名字。
qlib_factor_interface: |-
  Your python code should follow the interface to better interact with the user's system.
  Your python code should contain the following part: the import part, the function part, and the main part. You should write a main function name: "calculate_{function_name}" and call this function in the main guard if __name__ == "__main__": (note the quotes around __main__). Don't write any try-except block in your python code. The user will catch the exception message and provide the feedback to you.
  User will write your python code into a python file and execute the file directly with "python {your_file_name}.py". You should calculate the factor values and save the result into a HDF5(H5) file named "result.h5" in the same directory as your python file. The result file is a HDF5(H5) file containing a pandas dataframe. The index of the dataframe is the "datetime" and "instrument", and the single column name is the factor name,and the value is the factor value. The result file should be saved in the same directory as your python file.

  Follow this exact recipe to build the result, it is the only form known to work:
  ```Python
  import pandas as pd


  def calculate_<short_function_name>():
      df = pd.read_hdf("daily_pv.h5", key="data").sort_index()
      # rolling MUST be per instrument: a plain df[col].rolling(n) on the
      # (datetime, instrument) index mixes different stocks inside one window
      window = 5                              # put the factor's window here
      values = df["close"].groupby(level="instrument", sort=False).rolling(window).mean().droplevel(0)
      result = values.to_frame("<the factor name>").reindex(df.index)   # keeps datetime+instrument index
      result.to_hdf("result.h5", key="data")


  if __name__ == "__main__":
      calculate_<short_function_name>()
  ```
  Hard rules:
  - Copy the entry guard **verbatim**: `if __name__ == "__main__":` — `__main__` inside two
    double quotes, and a colon at the end. Never write it as `if __name__ == __main__` (no
    quotes) and never leave a quote open; either way the file fails to even parse.
    A broken guard kills the whole factor experiment, not just this one factor.
  - `to_frame` exists only on a Series. It is valid on `values` above because `.droplevel(0)`
    leaves a Series; if your expression already yields a DataFrame, do not call `to_frame` on it
    (use `df[["<the factor name>"]]` style selection instead), or the run dies with
    `AttributeError: 'DataFrame' object has no attribute 'to_frame'`.
  - NEVER build a rolling statistic with `.apply(...)`, `.agg(<lambda>)` or a python loop over
    windows. The panel has 12M+ rows, so one per-window callback burns >15 minutes of single
    core CPU and the whole round is written off as "still running" (this is exactly what the
    momentum factor did on 09-23). It is also wrong by one bar: `rolling(5).apply(x[-1]/x[0])`
    divides by the value 4 days ago, not 5. Every operation you are allowed to use is
    vectorized, and the library definition of momentum is a lag of exactly N days:
      N-day momentum of a column: `g = df["close"].groupby(level="instrument", sort=False)`
        then `values = df["close"] / g.shift(window) - 1`   # a Series, same index as df
      ratio of two rolling statistics: divide the two Series, e.g.
        `num = df["volume"].groupby(level="instrument", sort=False).rolling(5).mean().droplevel(0)`
        `den = df["volume"].groupby(level="instrument", sort=False).rolling(20).mean().droplevel(0)`
        then `values = num / den`
      `g.shift(n)` / `rolling(n).mean()` / `rolling(n).std()` are all vectorized; use them.
  - Name the single result column with `Series.to_frame("<factor name>")` (or
    `pd.DataFrame({"<factor name>": values})`). The string must be the factor name **verbatim**:
    same words, same hyphens, same capitalisation, no trailing space. Never substitute an
    underscored or lowercased variant of it (writing `5_day_SMA_volume_over_20_day_SMA_volume`
    for a factor named "5-day SMA of Volume over 20-day SMA of Volume" misses the point — the
    factor name is how the factor library and the research report key this column).
  - Nothing in the pipeline actually enforces that string: result.h5 is consumed positionally,
    and the only reader of the name is another language model, which can mis-transcribe it. On
    09-23 a reviewer told the coder to rename "20-day MAX of Price" to `'20-day MAX of price '`
    (lowercase p, trailing space) and the coder obeyed it. So when a review asks you to change
    the column name, do NOT copy the name from the review — re-read the factor name given in
    your own task and copy from there; where the two disagree, the task wins.
  - NEVER write `pd.DataFrame(a_series, columns=["some name"])`: in pandas 2.x `columns=`
    selects by name, so if it does not equal the Series name you silently get 0 rows and
    the code dies later on the index assignment.
  - NEVER reassign `result.index = df.index`; use `.reindex(df.index)` as in the recipe.
  - Do not reset_index() and then relabel the columns positionally.
  - The result must keep exactly the two index levels datetime, instrument and exactly one
    column. Leading NaN for the warm-up window of each instrument is expected, keep them.
