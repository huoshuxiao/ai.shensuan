# 本地 LLM 适配用提示词覆盖（不修改 site-packages）—— **ETF 线副本**
#
# 生效原理：rdagent/utils/agent/tpl.py 的 load_content 按「进程 CWD 相对路径 →
# RD-Agent 包内默认」的顺序取模板，且文件缺失键（KeyError）会继续回落到包内，
# 所以本文件只需放要改的那几个键，其余仍用官方原文。
# factor 循环子进程的 CWD 就是本目录 rdagent_output/，故 scenarios/qlib/prompts.yaml
# 恰好覆盖 rdagent/scenarios/qlib/prompts.yaml。
# 键名与使用处：factor_proposal.py:44 用 factor_hypothesis_specification，
# factor_proposal.py:68 用 factor_experiment_output_format。
#
# 本文件只服务 ETF 线：ALREADY TESTED / CANDIDATE LIST 里的每一个数字都是 ETF 全市场池
# 自己量出来的（851 只 × 2019-01-02~2026-09-22 × 1865 个有效日，中位 442 只/日；入口
# etf/v1/src/run_etf_factor_eval.py → run_etf_portfolio_eval.py → run_etf_redundancy_check.py）。
# **不与股票线那份同步**：同一批表达式在两条线上的 RankIC 连符号都不一致（价格水平族在本池
# +0.025~+0.028，在 A 股个股池 -0.013~-0.016），把对面的结论抄过来就是把别人的测量当本线的先验。
# 两边真正共用的只有命名文法那一段——因为 DSL 翻译器同源（common/src/core/rdagent_driver.py），
# 只有改文法时才需要动两处。IC 数值横向比较无意义，靠因子库的 market 字段隔离。
#
# 治的病：09-22 那轮 coder:7b 提出的唯一因子是 MA_5 = Σ F_{t-i}/5，把「因子值」
# 当成输入序列做滑窗。本数据集只有 OHLCV，没有「因子值」这一列，于是实现 10/10
# 失败、回收的 LaTeX 也翻不出管线 DSL（expr 为空）→ 对主线净贡献 0。

factor_hypothesis_specification: |-
  1. **Available raw data is OHLCV ONLY:**
    - The only input series you may use are the raw price/volume fields of each instrument: $open, $high, $low, $close (a.k.a. Price) and $volume.
    - You MUST NOT treat an already-computed factor, a model prediction, or any "factor value" series as an input. There is no such column in the dataset; a hypothesis built on it can never be implemented. In particular, expressions like F_{t-i} or "moving average of the factor" are forbidden — the input of every factor must be one of the five raw fields above.
    - Do not propose machine-learning, multi-dimensional or data-source factors (no alternative data, no model outputs are available here).
  2. **Prefer what is new to THIS panel, not what is new in general:**
    - Every single-field transform of Price, and every single-field transform of Volume,
      has already been measured on this cross-section (see ALREADY TESTED). What is left
      is the shape "today's close divided by a windowed statistic of close" — the names in
      the CANDIDATE LIST.
    - Concisely explain why the factor is expected to work, and name the regime in which
      it should fail. Avoid complex or combined factors beyond the allowed ratio form.
  3. **EXACTLY 2 factors per generation (hard cap):**
    - Output precisely 2 factor keys in the JSON object. Not 1, not 3, never 12.
      This machine is compute-limited: a factor experiment only reaches backtest
      ("running") after EVERY factor in it has been implemented, so the number of
      factors per generation multiplies the whole wall time.
    - Pick 2 names verbatim from the CANDIDATE LIST below (they were drafted, translated
      and replayed on this panel but are not in the factor library yet), so the pipeline
      can consume them immediately; only invent a new name if none fits, and stay inside
      the naming rule and off the ALREADY TESTED list.
    - Both picks may now be ratio names: the recovery chain translates the "over" form and
      both halves are single-window expressions, so the old "at most one ratio" cap is moot
      now that no untested single-field name is left. But the two MUST differ in the
      denominator's operator (an SMA-type against a MAX/MIN-type), not merely in its window
      length: window-only variants of this shape measure rank correlation 0.72~0.96 against
      each other here, i.e. one factor wearing two windows.
    - All must be computable from the raw fields above.
  ALREADY TESTED — never propose these again. "redundancy" is the mean daily
  cross-sectional rank correlation against the closest factor already on record; RD-Agent's
  own dedup discards anything >= 0.99 against the library, and this line's precheck flags
  >= 0.85. Measured on the ETF panel named in the header:
    - THE ENTIRE PRICE-LEVEL FAMILY IS ONE FACTOR. SMA / VWAP / MAX / MIN of Price at any
      window all sit >= 0.989 against raw close, and raw close is itself a library factor
      (hybrid_2), so every new window of it gets discarded on the way in:
        5-day VWAP of Price 0.9988 | 20-day MIN of Price 0.9956 | 20-day MAX of Price 0.9891
        5-day SMA of Price 0.9984 | 20-day SMA of Price 0.9930 (those two are 0.9952 apart)
      Its RankIC@h10 on this panel is POSITIVE, +0.025 ~ +0.028 (ICIR +0.113 ~ +0.126) — the
      opposite sign to the A-share stock panel. That is a property of an ETF panel where the
      price level tracks fund size and recent inflows; it does not make a new window of the
      price level a new factor.
    - THE ENTIRE VOLUME FAMILY IS ONE FACTOR, AND IT HAS BEEN MEASURED TO PAY NOTHING.
      mean/std/max/min of volume and of amount are mutually 0.918 ~ 0.991, they hold the
      highest |ICIR| on this board (-0.348 at h10, -0.439 at h20, t = -15.0), and the best of
      them replayed tradable (20-day mean of Volume, top-10, 10-day hold, 6bp one-way) earns
      -0.26% per year against the investable equal-weight pool (+0.19% at top-20); its
      high-volume leg loses -3.4%/yr. Do not propose another single-field Volume or amount
      factor at any window or operator: on this panel a large ICIR has been measured to mean
      liquidity/size beta, not alpha.
    - MOM of Price at any window: 10-day MOM of Price is 0.9991 against library mogp_3
      (discarded); 5-day and 20-day are already on record at 0.9990 and 0.9987.
    - A ratio whose numerator is a SMOOTHED price has been tried and loses:
        5-day SMA of Price over 20-day MIN of Price: +4.18%/yr excess at 6bp, +0.95% at 15bp,
          -4.44% at 30bp
        5-day SMA of Price over 20-day MAX of Price: -4.90%/yr excess already at 6bp, while
          the same denominator over today's raw close gives +27.87%
      Smoothing the numerator destroys the signal — write the numerator as 1-day SMA of Price.
    - 5-day STD of Volume over 20-day STD of Volume: the most independent name measured
      (0.108 against the library) and the emptiest one — ICIR +0.046, +0.82%/yr excess.
      Recorded so it is not proposed again as "a volume ratio nobody has touched".
    - A spelled-out operator is THE SAME factor as its abbreviated token and is equally
      tested: "Momentum" = MOM, "Simple Moving Average" = SMA, "Standard Deviation" = STD,
      "Maximum"/"Minimum" = MAX/MIN. Writing an operator in words neither makes a tested
      factor new nor survives the verbatim name match downstream.
  CANDIDATE LIST — drafted, translatable and replayed on this panel, not yet in the factor
  library. All share the form "1-day SMA of Price over <N>-day <OP> of Price" (= today's
  close divided by a windowed statistic of close). Each line: rank correlation against the
  library, then top-10 excess over the investable equal-weight benchmark at 6bp one-way,
  then what survives at 60bp (10x the assumed cost). Ordered by expected value:
    - 1-day SMA of Price over 60-day MAX of Price   lib 0.581  +27.99% -> +9.05%  (ICIR +0.109; lowest turnover, 0.70 per rebalance)
    - 1-day SMA of Price over 5-day SMA of Price    lib 0.761  +43.99% -> +21.29% (largest excess and positive in all 8 measured years, but 0.949 against 价量·VWAP偏离5d, which this line already holds -> the precheck will call it a re-skin)
    - 1-day SMA of Price over 20-day MAX of Price   lib 0.645  +27.87% -> +6.04%  (identical to 位置·距20日高, already replayed at +29.41% -> pair it with a genuinely different denominator)
    - 1-day SMA of Price over 60-day SMA of Price   lib 0.767  +18.62% -> +4.50%
    - 1-day SMA of Price over 20-day MIN of Price   lib 0.702  +16.68% -> -2.27%  (does not survive 15bp)
    - 1-day SMA of Price over 60-day MIN of Price   lib 0.612  +7.51% -> -4.98%
    - 5-day SMA of Price over 20-day MIN of Price   lib 0.568  +4.18% -> -4.44%  (at 30bp; the only smoothed-numerator name left, kept for its independence, not its return)
  Do NOT pick 1-day SMA of Price over 20-day SMA of Price (it IS 位置·C/MA20, 1.000), nor
  over 10-day SMA (0.890) or over 20-day VWAP (0.856) — those sit above this line's own
  redundancy bar against names already on record.
  TREAT THE ABOVE AS A PRIOR, NOT AS EVIDENCE. Every excess number is one in-sample replay
  of one top-k / one-hold setting on a mirror of ETFs that are still listed today
  (survivorship); the panel's daily cross-sectional rank correlation is about 0.33, so a
  40-name basket carries roughly 2.9 independent observations, and no PBO or
  deflated-Sharpe penalty has been applied to these numbers yet.
  4. **Only the allowed ratio form is "combined":**
    - Combined factors are permitted ONLY as "<M>-day SMA of Price over <N>-day <OP> of
      Price" with M=1 (today's close) unless a CANDIDATE LIST line says otherwise, and
      never by feeding one computed factor into another.
  5. **If a generation fails to beat SOTA:**
    - Do NOT fall back to a single-field factor — the naming rule allows 12 such forms
      (6 operators x 2 columns) at any window, and every family among them has been
      measured on this panel, so a fresh one is a re-skin, not a new direction. Move
      along the CANDIDATE LIST to a denominator with a different operator, and only
      after that consider a new window.
    - If a ratio fails to implement, check the name against the HARD NAMING RULE before
      blaming the idea: an untranslatable name costs the whole generation's backtest.
  6. Note
    - Highlight that factors surpassing SOTA are included in the library to avoid re-implementation.
    - No matter how many factors you plan to generate, only reply with one set of hypothesis and reason. The hypothesis can include the proposal of multiple factors at the same time.

factor_experiment_output_format: |-
  The output should follow JSON format. The schema is as follows:
  {
      "factor name 1": {
          "description": "description of factor 1, start with its type, e.g. [Momentum Factor]",
          "formulation": "latex formulation of factor 1",
          "variables": {
              "variable or function name 1": "description of variable or function 1",
              "variable or function name 2": "description of variable or function 2"
          }
      },
      "factor name 2": {
          "description": "description of factor 2, start with its type, e.g. [Machine Learning based Factor]",
          "formulation": "latex formulation of factor 2",
          "variables": {
              "variable or function name 1": "description of variable or function 1",
              "variable or function name 2": "description of variable or function 2"
          }
      }
      # Don't add ellipsis (...) or any filler text that might cause JSON parsing errors here!
  }

  HARD NAMING RULE for every factor key ("factor name N") — it MUST be exactly ONE of:
      <N>-day <OP> of <Column>
      <M>-day <OP> of <Column> over <N>-day <OP> of <Column>      (a ratio of two such factors)
  where <N>,<M> are positive integer windows and <OP> and <Column> come from these closed lists only:
      <OP>     ∈ SMA | STD | MAX | MIN | VWAP | MOM
      <Column> ∈ Price | Volume
  MOM means simple N-day momentum (day-over-N change, not a moving average):
      price MOM:  P_t / P_{t-N} - 1        volume MOM:  V_t / V_{t-N} - 1
  Examples of valid names: "5-day SMA of Price", "20-day STD of Volume", "10-day VWAP of Price",
  "5-day MOM of Price", "5-day SMA of Volume over 20-day SMA of Volume".
  In the ratio form both halves must themselves be valid single factors above, the divisor must not
  be a constant, and the name must keep the word "over" verbatim (downstream translates the name).
  Invalid and therefore forbidden: "EMA"/"exponentially weighted" (no such operator downstream),
  "Momentum"/"Ratio"/"Factor of Factor"/any name without an explicit day window and an explicit
  Price-or-Volume column, and any formulation whose input is a computed factor instead of a raw field.
  Write the operator ONLY as one of the six uppercase tokens above. Spelling it out — "20-day
  Momentum of Price", "5-day Simple Moving Average of Volume over ..." — breaks the pipeline: the
  name you output becomes the result column name and is matched verbatim downstream, so a
  synonymous-but-different string is a duplicate factor that the library cannot recognise.
  In "formulation", write the input as the raw field itself (e.g. P_{t-i} for Price, V_{t-i} for
  Volume) and declare in "variables" that P = $close / Price and V = $volume.

# 同一类官方示例缺陷：schema 示例最后一项带尾逗号。这一键被
# scenarios/qlib/proposal/factor_proposal.py:43 用于生成因子假设，正是产因子的
# 那一环，模型照抄格式就会让 JSONParser 四策略全灭（本轮侥幸解析成功，属概率性）。
# 与包内原文逐字一致，仅删除示例里的尾逗号。
factor_hypothesis_output_format: |-
  The output should follow JSON format. The schema is as follows:
  {
  "hypothesis": "The new hypothesis generated based on the information provided. Limit in two or three sentences.",
  "reason": "The reason why you generate this hypothesis. It should be comprehensive and logical. It should cover the other keys below and extend them. Limit in two or three sentences."
  }
