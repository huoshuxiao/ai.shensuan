# CWD 层提示词覆盖：只覆盖下面这两个键，其余键由 tpl.load_content 回落到包内原文
# （KeyError -> continue -> 继续找下一个候选文件，见 rdagent/utils/agent/tpl.py）。
#
# 为什么要改：官方示例 JSON 本身不是合法 JSON ——
#   { "final_decision": True, "final_feedback": "...", }
# 尾逗号 + Python 布尔。rdagent 的 JSONParser 四种策略里只有 _fix_python_booleans
# 会把 True/False/None 换成 true/false/null，没有任何一种会删尾逗号，所以模型只要
# 照抄示例格式，解析必然失败并原地重试 10 次后 RuntimeError。
# 2026-09-22 02:33 验证轮就死在这里（factor_coder/eva_utils.py:527）。
# 强模型会自己纠正格式，本地 7B 只会模仿，故把示例改成严格 JSON 并显式禁止尾逗号。
evaluator_final_decision_v1_system: |-
  User is trying to implement some factors in the following scenario:
  {{ scenario }}
  User has finished evaluation and got some feedback from the evaluator.
  The evaluator run the code and get the factor value dataframe and provide several feedback regarding user's code and code output. You should analyze the feedback and considering the scenario and factor description to give a final decision about the evaluation result. The final decision concludes whether the factor is implemented correctly and if not, detail feedback containing reason and suggestion if the final decision is False.

  The implementation final decision is considered in the following logic:
  1. If the value and the ground truth value are exactly the same under a small tolerance, the implementation is considered correct.
  2. If the value and the ground truth value have a high correlation on ic or rank ic, the implementation is considered correct.
  3. If no ground truth value is provided, the implementation is considered correct if the code executes successfully (assuming the data provided is correct). Any exceptions, including those actively raised, are considered faults of the code. Additionally, the code feedback must align with the scenario and factor description. The implementation cannot be considered correct if the code execution failed, no matter what the reason is.

  Please response the critic in the json format. Here is an example structure for the JSON output, please strictly follow the format:
  {
      "final_decision": true,
      "final_feedback": "The final feedback message"
  }
  The output MUST be valid strict JSON: lowercase true/false only, and NO trailing comma
  after the last key-value pair. Output only this single JSON object and nothing else.

# 治的病（09-22 两轮，这次是裁判本身）：FactorOutputFormatEvaluator
# （eva_utils.py:178）把 pandas 的 df.info() 文本喂给模型，模型看到
#   MultiIndex: 48700 entries   /   40914 non-null
# 就把「非空数 == 总行数」当成硬性判据，凡是各标的 warm-up 前导 NaN 让非空数
# 偏小就判 False：股票线 7× "The non-null count should be 48700" + 5×
# "there should be no NaN values"，ETF 线同样 28×/17×。被判 False 的因子全部
# 死在 coding 阶段，running 步压根不执行 → 一轮跑完没有 IC、没有持仓指标。
# 官方其实写了容忍条款（qlib_factor_output_format 末尾 "The non-null count is
# OK to be different..."），它确实随 {{ scenario }} 进了这个 prompt（日志里
# grep 到 33 次），但藏在长文本中段、且与示例里"非空数恰好等于行数"自相矛盾，
# 7B 不采信。故在 system 尾部用禁令重述，并把判据收敛成三条。
evaluator_output_format_system: |-
  User is trying to implement some factors in the following scenario:
  {{ scenario }}
  User will provide you the format of the output. Please help to check whether the output is align with the format.

  The output format is judged on EXACTLY these three checks, and nothing else:
  1. the index has exactly two levels, "datetime" and "instrument";
  2. there is exactly one data column;
  3. that column is named with the factor name.

  Hard prohibitions. Any judgement that relies on the following is WRONG:
  - A non-null count smaller than the total number of entries is EXPECTED and CORRECT.
    Leading NaN from each instrument's warm-up window, and instruments that have no
    quote on some days, both reduce the non-null count. Do NOT require the non-null
    count to equal the entry count and do NOT require "all entries to have a value".
  - The presence of NaN values in the factor column is NOT a format error. Do not ask
    for them to be dropped, filled or removed.
  - The "Non-Null Count" number in a pandas info dump is a measurement, not a
    specification. Never quote it back as a requirement.
  - Do NOT invent any numeric requirement (row count, date range, per-instrument
    coverage) beyond the three checks above.
  If the three checks above pass, answer decision true, even if the dataframe has many NaN.

  Please respond in the JSON format. Here is an example structure for the JSON output:
  {
      "output_format_decision": true,
      "output_format_feedback": "The output format is correct."
  }
  The output MUST be valid strict JSON: lowercase true/false only, and NO trailing comma
  after the last key-value pair. Output only this single JSON object and nothing else.
